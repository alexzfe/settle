# Check every pull request and every push to main; on main, also build the image, push it to
# ghcr.io/alexzfe/settle, and deploy it to the homeserver. deploy/README.md explains the setup.
name: deploy

on:
  pull_request:
  push:
    branches: [main]

# One run per branch at a time. A newer push to a pull request cancels its older check; on main
# nothing is cancelled half-way, runs queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The lockfile does not record pnpm's version, so it is pinned here and in the Dockerfile.
  PNPM_VERSION: 12.4.2
  NODE_VERSION: 26
  IMAGE: ghcr.io/alexzfe/settle

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: PNPM_VERSION=${{ env.PNPM_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the homeserver itself, on the self-hosted runner of deploy/github-runner/compose.yaml,
  # which sees the host's Docker and /docker/settle at the same path. To deploy over SSH instead,
  # replace only this job (deploy/README.md, "Deploying over SSH instead").
  deploy:
    needs: image
    runs-on: [self-hosted, homeserver]
    # Deploys never overlap, whichever run started them.
    concurrency:
      group: deploy-homeserver
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment:
      name: homeserver
      url: https://settle.example.com
    defaults:
      run:
        working-directory: /docker/settle
    env:
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/compose.yaml
          sparse-checkout-cone-mode: false
          path: settle
      # The job's token may read the private package; it logs out again when the job ends.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the stack
        run: |
          # The container runs as uid 1000 and must own its data folder.
          mkdir -p data
          chown 1000:1000 data
          cp "$GITHUB_WORKSPACE/settle/deploy/compose.yaml" compose.yaml
          printf 'SETTLE_IMAGE_TAG=%s\n' "$TAG" > .env
      - name: Pull and start
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
      - name: Wait for /health
        run: |
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:4380/health; then
              echo
              echo "Settle $TAG is up."
              exit 0
            fi
            sleep 2
          done
          echo "Settle $TAG did not answer /health within a minute." >&2
          docker compose logs --tail 50 settle >&2
          exit 1
      - name: Status
        if: always()
        run: docker compose ps
