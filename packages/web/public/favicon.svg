<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>Settle</title>
  <style>
    /* A tab bar is not a page: there is no ink to inherit, so a currentColor mark comes out black
       and disappears on a dark tab bar. The icon carries its own ground instead, the brand kit's
       paper and ink (app-icon-paper.svg, app-icon-dark.svg), and swaps them where the browser
       follows a dark theme. A browser that ignores the media query keeps the paper ground, which
       stays visible either way. */
    .ground { fill: #f6f3ee; }
    .mark { fill: none; stroke: #1a1815; stroke-width: 2.4; }
    .waterline { fill: #1a1815; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #1a1815; }
      .mark { stroke: #f6f3ee; }
      .waterline { fill: #f6f3ee; }
    }
  </style>
  <rect class="ground" width="24" height="24" rx="5"></rect>
  <g class="mark" transform="translate(3 3) scale(0.75)">
    <circle cx="12" cy="12" r="9"></circle>
    <path class="waterline" d="M3.67 15.4A9 9 0 0 0 20.33 15.4Z"></path>
  </g>
</svg>
