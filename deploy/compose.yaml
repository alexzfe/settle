# Settle: the app that keeps a home's rooms, decisions, and purchases, and gives the user's own
# Claude Code an MCP endpoint to work on them.
#
# This file lives in the Settle repo (deploy/compose.yaml) and is the source of truth. Every deploy
# from GitHub Actions copies it to /docker/settle/compose.yaml on the homeserver, so edit it in the
# Settle repo, never on the box: a hand edit there is overwritten by the next push to main. The
# nightly config backup then mirrors the copy into the homeserver-docker-configs repo.
#
# Reached at https://settle.example.com: Nginx Proxy Manager terminates TLS with the wildcard
# certificate and forwards to 100.64.0.1:4380, passing the Host header through.
#
# Day to day (in /docker/settle):
#   docker compose ps                  # is it up, and healthy?
#   docker compose logs -f settle      # follow the server's output
#   docker compose up -d               # apply a changed .env (a rollback, say)
#
# Rollback: set SETTLE_IMAGE_TAG in /docker/settle/.env to an earlier sha-xxxxxxx tag (the tags are
# listed on the package page, github.com/alexzfe/settle/pkgs/container/settle) and run
# `docker compose up -d`. The next push to main deploys the new commit again.

services:
  settle:
    # The image CI builds from each commit on main. Tags are sha-<7-char commit> (one per commit,
    # never moved) and main (always the newest). The deploy writes the exact sha tag into .env, so
    # this line always says which commit runs; the fallback to main is only for a hand-started stack
    # with no .env. The package is private: the box needs `docker login ghcr.io` (the deploy job
    # does it) before it can pull.
    image: ghcr.io/alexzfe/settle:${SETTLE_IMAGE_TAG:-main}
    container_name: settle
    restart: unless-stopped

    # host:container. 4380 is Settle's default port and was free on the box.
    ports:
      - "4380:4380"

    # Everything Settle keeps is in /data: settle.sqlite (the database, in WAL mode, so also its -wal
    # and -shm files), uploads/ (the Blueprint files), and rendered/ (their pages as PNGs). restic's
    # 01:00 backup finds settle.sqlite here and dumps it consistently, so no extra backup job.
    # The container runs as the image's `node` user (uid 1000); the folder must be writable by it.
    volumes:
      - ./data:/data

    environment:
      # The address the app is reached at. It lets the proxy's Host header through the app's
      # DNS-rebinding guard, and it is the origin the app writes into the Home Folder setup command
      # and the phone QR code. Scheme and host only, no path, no trailing slash.
      SETTLE_PUBLIC_ORIGIN: https://settle.example.com
      # The image already sets the three below; they are spelled out so this file tells the whole
      # story. SETTLE_HOST=0.0.0.0 listens on every interface inside the container (needed for the
      # published port); the app refuses a non-loopback address without SETTLE_PUBLIC_ORIGIN.
      SETTLE_HOST: 0.0.0.0
      SETTLE_PORT: "4380"
      SETTLE_DATA_DIR: /data

    # Docker's own check, the same as the image's HEALTHCHECK: the slim Node image has no curl, so
    # node's fetch asks /health. `docker compose ps` shows (healthy) once it answers; the deploy job
    # also polls it. Gatus checks https://settle.example.com/health from outside.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4380/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # One Node process; it idles near 100 MB and grows while rendering a Blueprint PDF.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M

    labels:
      # Watchtower re-pulls images on Sundays. Settle is deployed by CI with a pinned sha tag from a
      # private registry, so Watchtower has nothing to do here and could only fail; opt out.
      com.centurylinklabs.watchtower.enable: "false"
