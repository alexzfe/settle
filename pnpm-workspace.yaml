  "@hono/node-server": ^2.1.1
  "@modelcontextprotocol/sdk": ^1.30.0
  "@tanstack/react-query": ^5.102.8
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.5.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  concurrently: ^10.0.5
  hono: ^4.13.7
  jsdom: ^30.0.1
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router: ^8.3.1
  tsx: ^4.23.13
  typescript: ^7.0.2
  vite: ^8.3.0
  vitest: ^5.0.0
  yaml: ^2.9.1
  zod: ^4.6.4
